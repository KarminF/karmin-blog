<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Tailwind + daisyUI（打包版） -->
      <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.23/dist/full.min.css" rel="stylesheet" type="text/css" />
  <title>商品详情页图片轮播</title>
  <style>
    /* 主图比例，常见 1:1 或 4:3，自行替换 */
    .aspect-product { aspect-ratio: 1 / 1; }
    /* 禁止长按拖拽图片，引导用左右按钮或手势 */
    img { user-select: none; -webkit-user-drag: none; }
  </style>
</head>
<body class="bg-base-200 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-xl">
    <!-- 轮播容器 -->
    <div id="gallery" class="relative card bg-base-100 shadow-xl">
      <figure class="aspect-product overflow-hidden">
        <img id="main-image" src="" alt="" class="w-full h-full object-contain transition-transform duration-300" />
      </figure>

      <!-- 左右切换按钮 -->
      <button id="prev"
              class="btn btn-circle btn-ghost absolute left-2 top-1/2 -translate-y-1/2"
              aria-label="上一张">
        ❮
      </button>
      <button id="next"
              class="btn btn-circle btn-ghost absolute right-2 top-1/2 -translate-y-1/2"
              aria-label="下一张">
        ❯
      </button>

      <!-- 圆点指示器 -->
      <div id="dots" class="flex items-center justify-center gap-2 py-3"></div>
    </div>

    <!-- 示例：缩略图（可选） -->
    <div id="thumbs" class="mt-3 grid grid-cols-5 gap-2"></div>
  </div>

  <script>
    // 1) 你的图片数据（真实项目里可从后端渲染或 JSON 获取）
    const images = [
      { src: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?q=80&w=1200&auto=format&fit=crop", alt: "商品图 1" },
      { src: "https://images.unsplash.com/photo-1517336714731-489689fd1ca8?q=80&w=1200&auto=format&fit=crop", alt: "商品图 2" },
      { src: "https://images.unsplash.com/photo-1512496015851-a90fb38ba796?q=80&w=1200&auto=format&fit=crop", alt: "商品图 3" },
      { src: "https://images.unsplash.com/photo-1512496015851-a90fb38ba796?q=80&w=1200&auto=format&fit=crop", alt: "商品图 3" },
      { src: "https://images.unsplash.com/photo-1512496015851-a90fb38ba796?q=80&w=1200&auto=format&fit=crop", alt: "商品图 3" },
      { src: "https://images.unsplash.com/photo-1512496015851-a90fb38ba796?q=80&w=1200&auto=format&fit=crop", alt: "商品图 3" },
    ];

    // 2) 基础引用
    const mainImage = document.getElementById('main-image');
    const dotsWrap  = document.getElementById('dots');
    const thumbsWrap= document.getElementById('thumbs');
    const prevBtn   = document.getElementById('prev');
    const nextBtn   = document.getElementById('next');

    // 3) 状态
    let index = 0;

    // 4) 渲染圆点与缩略图
    const dots = images.map((_, i) => {
      const btn = document.createElement('button');
      btn.className = "btn btn-xs btn-circle";
      btn.setAttribute('aria-label', `切换到第 ${i+1} 张`);
      btn.addEventListener('click', () => goTo(i));
      dotsWrap.appendChild(btn);
      return btn;
    });

    const thumbs = images.map((img, i) => {
      const b = document.createElement('button');
      b.className = "border rounded-lg overflow-hidden hover:opacity-80 focus:outline-none";
      b.innerHTML = `<img src="${img.src}" alt="${img.alt}"
                        class="w-full h-20 object-cover" />`;
      b.addEventListener('click', () => goTo(i));
      thumbsWrap.appendChild(b);
      return b;
    });

    // 5) 更新视图
    function render() {
      const { src, alt } = images[index];
      mainImage.src = src;
      mainImage.alt = alt;

      // 高亮圆点
      dots.forEach((d, i) => {
        d.classList.toggle('btn-primary', i === index); // 当前高亮
        d.classList.toggle('btn', i !== index);   // 其他弱化
      });

      // 高亮缩略图（可选）
      thumbs.forEach((t, i) => {
        t.classList.toggle('ring', i === index);
        t.classList.toggle('ring-primary', i === index);
      });
    }

    // 6) 切换逻辑（循环）
    function goTo(i) {
      index = (i + images.length) % images.length; // 取模，保证循环
      render();
    }
    function next() { goTo(index + 1); }
    function prev() { goTo(index - 1); }

    // 7) 事件绑定
    prevBtn.addEventListener('click', prev);
    nextBtn.addEventListener('click', next);

    // 8) 首次渲染
    render();
  </script>
</body>
</html>
